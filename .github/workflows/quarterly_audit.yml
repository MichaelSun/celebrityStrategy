name: Quarterly 13F & 13G Institutional Radar

on:
  schedule:
    # 1. 13F Peak Filing Window: Daily at 14:00 UTC from the 10th to the 20th of Feb, May, Aug, Nov
    - cron: '0 14 10-20 2,5,8,11 *'
    # 2. Weekly Monday check for 13G/13D early beneficial ownership filings
    - cron: '0 14 * * 1'

  workflow_dispatch:
    inputs:
      tier:
        description: 'Guru Tiers to audit (e.g. 1 or 1,2)'
        required: false
        default: '1'
      scan_13g:
        description: 'Scan SEC 13G/13D early beneficial ownership filings'
        type: boolean
        required: false
        default: true
      global_signals:
        description: 'Include Dataroma Grand Portfolio consensus & All Activity feed'
        type: boolean
        required: false
        default: true
      refresh_valuation:
        description: 'Refresh valuation cache via yfinance'
        type: boolean
        required: false
        default: true
      send_notification:
        description: 'Dispatch executive summary to configured Webhooks'
        type: boolean
        required: false
        default: true

jobs:
  run-radar-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run SEC 13G/13D Early Warning Scanner
      if: ${{ github.event.inputs.scan_13g != 'false' }}
      run: |
        python3 scripts/scan_sec_13g.py --days 180 --top 15

    - name: Run Global Signals & Weight Backfill
      if: ${{ github.event.inputs.global_signals != 'false' }}
      run: |
        python3 scripts/fetch_global_signals.py --backfill HC,HH,BRK

    - name: Refresh Valuation Cache
      if: ${{ github.event.inputs.refresh_valuation != 'false' }}
      run: |
        python3 scripts/refresh_valuation_cache.py

    - name: Run Full 13F Radar Audit & Report Generator
      run: |
        TIER_ARG="${{ github.event.inputs.tier || '1' }}"
        FLAGS="--tier ${TIER_ARG} --conviction-scores"
        if [ "${{ github.event.inputs.scan_13g }}" != "false" ]; then
          FLAGS="${FLAGS} --scan-13g"
        fi
        if [ "${{ github.event.inputs.global_signals }}" != "false" ]; then
          FLAGS="${FLAGS} --global-signals"
        fi
        echo "Running: python3 .agents/skills/celebrity-clone-13f-auditor/scripts/fetch_dataroma_holdings.py ${FLAGS}"
        python3 .agents/skills/celebrity-clone-13f-auditor/scripts/fetch_dataroma_holdings.py ${FLAGS}

    - name: Run CFO-Check Bridge Dry-Run
      run: |
        python3 scripts/bridge_to_cfo_check.py --dry-run

    - name: Verify Radar Test Suite
      run: |
        python3 -m unittest discover -s tests -p "test_*.py" -v

    - name: Dispatch Executive Intelligence Notification
      if: ${{ github.event.inputs.send_notification != 'false' }}
      env:
        WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      run: |
        python3 scripts/send_notification.py

    - name: Commit and Push Updated Reports & Database
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add data/investor_radar.db reports/
        if git diff --staged --quiet; then
          echo "No new reports or database changes to commit."
        else
          git commit -m "chore(cron): auto-update quarterly 13F/13G radar snapshot [skip ci]"
          git push
        fi
