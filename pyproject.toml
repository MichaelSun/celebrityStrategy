[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "celebrity-strategy"
version = "1.0.0"
description = "Institutional 13F & Off-13F Guru Clone Portfolio Radar for Value Investors"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Michael Sun"}
]
keywords = [
    "value-investing",
    "13f",
    "portfolio-tracking",
    "dataroma",
    "sec-edgar",
    "buffett",
    "li-lu",
    "duan-yongping",
    "stock-analysis"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.31.0",
    "urllib3>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "yfinance>=0.2.36",
    "PyYAML>=6.0.0",
    "pandas>=2.0.0",
    "rich>=13.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "flake8>=6.0.0"
]

[project.urls]
Homepage = "https://github.com/MichaelSun/celebrityStrategy"
Repository = "https://github.com/MichaelSun/celebrityStrategy.git"
"Downstream Valuation Pipeline" = "https://github.com/MichaelSun/cfo-check"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*", "data*"]
